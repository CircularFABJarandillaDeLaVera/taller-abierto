<article class="product-card{% if featured %} featured{% endif %}"><a class="product-visual visual-{{ visual_index % 4 }}" href="/productos/{{ product.slug }}" aria-label="Ver {{ product.name }}"><img src="/static/{{ product.image_path }}" alt="Ilustración de ejemplo: {{ product.name }}" loading="lazy"><span class="visual-label">Ilustración de ejemplo</span></a><div class="product-card-body"><div class="product-title-row"><h3><a href="/productos/{{ product.slug }}">{{ product.name }}</a></h3><span class="price">{{ "%.2f"|format(product.indicative_price) }} €</span></div><p class="product-meta"><span>Por <a href="/creadores#{{ product.creator.alias }}">@{{ product.creator.alias }}</a></span><span>Precio orientativo</span></p></div></article>
